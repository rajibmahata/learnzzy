# Production Nginx example for the VPS. NOT active by default.
#
# 1. Provision certificates (e.g. `certbot --nginx -d <domain>`) OR replace
#    the ssl_certificate lines below with your cert paths.
# 2. Do NOT start nginx with this file until the cert files exist —
#    nginx refuses to start with missing ssl_certificate paths.
# 3. Keep deploy/nginx.conf for plain local/HTTP use.
#
# Replace every <production-domain> and /etc/ssl/<domain>/* placeholder.

# HTTP -> HTTPS redirect (also serves ACME challenges).
server {
  listen 80;
  server_name <production-domain>;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name <production-domain>;

  ssl_certificate /etc/ssl/<production-domain>/fullchain.pem;
  ssl_certificate_key /etc/ssl/<production-domain>/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # HSTS is also set by the app; keep both consistent (includeSubDomains).
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  client_max_body_size 2m;

  # App is bound to loopback only (see docker-compose.prod.yml).
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /health {
    proxy_pass http://127.0.0.1:3000/health;
    access_log off;
  }
}
