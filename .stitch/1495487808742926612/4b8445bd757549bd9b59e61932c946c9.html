<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_45 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_45" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_45');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Rich 3D Animal Wonderland Scene for Learnzzy
// Built for container embedding with global THREE namespace
const container = document.getElementById('threejs-container-ANIMATION_43') || 
                  document.getElementById('threejs-container-ANIMATION_PLAY') || 
                  document.getElementById('threejs-container') || 
                  document.body;

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || (window.innerHeight * 0.75);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 4.5, 20);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.innerHTML = '';
container.appendChild(renderer.domElement);

// Lighting setup - warm, whimsical sunshine & soft sky illumination
const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfff3d6, 1.5);
sunLight.position.set(12, 22, 14);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 1024;
sunLight.shadow.mapSize.height = 1024;
scene.add(sunLight);

const blueSkyFill = new THREE.DirectionalLight(0xbae6fd, 0.9);
blueSkyFill.position.set(-14, 12, -10);
scene.add(blueSkyFill);

const peachFill = new THREE.PointLight(0xfed7aa, 0.8, 30);
peachFill.position.set(0, 2, 8);
scene.add(peachFill);

// Floating Wonderland Island Group
const island = new THREE.Group();
scene.add(island);

// Island Lush Grass Layer
const grassMat = new THREE.MeshToonMaterial({ color: 0x86efac });
const mound = new THREE.Mesh(new THREE.CylinderGeometry(11.5, 9.2, 2.4, 36), grassMat);
mound.position.y = -1.3;
mound.receiveShadow = true;
island.add(mound);

// Island biscuit/honeycomb ground layer
const biscuitMat = new THREE.MeshToonMaterial({ color: 0xfde047 });
const biscuit = new THREE.Mesh(new THREE.CylinderGeometry(9.2, 6.8, 1.4, 36), biscuitMat);
biscuit.position.y = -2.8;
island.add(biscuit);

// Island bottom float rock
const rockMat = new THREE.MeshToonMaterial({ color: 0x93c5fd });
const rock = new THREE.Mesh(new THREE.ConeGeometry(6.6, 3.2, 32), rockMat);
rock.position.y = -4.8;
rock.rotation.x = Math.PI;
island.add(rock);

// Whimsical Rainbow Arc
const rainbow = new THREE.Group();
const rainbowColors = [0xf87171, 0xfbbf24, 0x34d399, 0x38bdf8, 0xa855f7];
rainbowColors.forEach((color, i) => {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(13.2 + i * 0.45, 0.2, 12, 48, Math.PI),
    new THREE.MeshBasicMaterial({ color: color })
  );
  rainbow.add(ring);
});
rainbow.position.set(0, -0.6, -7);
rainbow.rotation.y = 0.1;
scene.add(rainbow);

// Fluffy Drifting Clouds
function makeCloud(x, y, z, s) {
  const cGroup = new THREE.Group();
  const cMat = new THREE.MeshToonMaterial({ color: 0xffffff });
  const p1 = new THREE.Mesh(new THREE.SphereGeometry(1.3, 16, 16), cMat);
  const p2 = new THREE.Mesh(new THREE.SphereGeometry(0.95, 14, 14), cMat);
  p2.position.set(1.2, -0.2, 0.1);
  const p3 = new THREE.Mesh(new THREE.SphereGeometry(0.9, 14, 14), cMat);
  p3.position.set(-1.1, -0.2, 0.1);
  const p4 = new THREE.Mesh(new THREE.SphereGeometry(1.0, 14, 14), cMat);
  p4.position.set(0.3, 0.7, 0.15);
  cGroup.add(p1, p2, p3, p4);
  cGroup.position.set(x, y, z);
  cGroup.scale.set(s, s, s);
  scene.add(cGroup);
  return cGroup;
}
const clouds = [
  makeCloud(-12, 7.5, -5, 1.4),
  makeCloud(12, 8.2, -6, 1.5),
  makeCloud(-2, 9.5, -10, 1.9),
  makeCloud(8, 4.5, -4, 1.0)
];

// Little candy mushrooms and flowers on the island
function makeMushroom(x, z, capColor, s) {
  const mGroup = new THREE.Group();
  const stemMat = new THREE.MeshToonMaterial({ color: 0xfffbeb });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.6, 10), stemMat);
  stem.position.y = 0.3;
  mGroup.add(stem);

  const capMat = new THREE.MeshToonMaterial({ color: capColor });
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2), capMat);
  cap.position.y = 0.55;
  mGroup.add(cap);

  mGroup.position.set(x, -0.1, z);
  mGroup.scale.set(s, s, s);
  island.add(mGroup);
}
makeMushroom(-2.5, 3.5, 0xef4444, 1.1);
makeMushroom(-3.1, 3.2, 0xf97316, 0.85);
makeMushroom(2.8, 3.6, 0x38bdf8, 1.0);
makeMushroom(3.4, 3.1, 0xa855f7, 0.8);
makeMushroom(0.3, 4.2, 0xfacc15, 0.9);

// Sparkle Golden Stars
const starMat = new THREE.MeshToonMaterial({ color: 0xfacc15, emissive: 0xfde047, emissiveIntensity: 0.6 });
const stars = [];
for (let i = 0; i < 15; i++) {
  const st = new THREE.Mesh(new THREE.OctahedronGeometry(0.38, 0), starMat);
  const angle = (i / 15) * Math.PI * 2;
  const rad = 4.8 + (i % 3) * 2.2;
  st.position.set(Math.cos(angle) * rad, 1.5 + (i % 4) * 1.5, Math.sin(angle) * rad * 0.7);
  scene.add(st);
  stars.push({ mesh: st, initY: st.position.y, speed: 1.2 + (i % 5) * 0.3 });
}

// Juicy Red Number Apples (for Teddy's Math Apple Counting game)
const appleGroup = new THREE.Group();
const appleMat = new THREE.MeshToonMaterial({ color: 0xef4444 });
const leafMat = new THREE.MeshToonMaterial({ color: 0x22c55e });
const appleList = [];
for (let i = 0; i < 5; i++) {
  const a = new THREE.Group();
  const aMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 12), appleMat);
  a.add(aMesh);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 6), new THREE.MeshBasicMaterial({ color: 0x78350f }));
  stem.position.set(0, 0.25, 0);
  stem.rotation.z = 0.2;
  a.add(stem);
  const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), leafMat);
  leaf.scale.set(1.5, 0.3, 0.8);
  leaf.position.set(0.1, 0.28, 0);
  a.add(leaf);
  a.position.set(-1.4 + i * 0.7, 0.1, 2.0 + Math.sin(i) * 0.4);
  appleGroup.add(a);
  appleList.push({ group: a, baseAngle: i });
}
island.add(appleGroup);

// ----------------------------------------------------
// 1. TEDDY BEAR 🧸 (Center - Big welcoming cheerful bear waving both hands, inviting kids!)
// ----------------------------------------------------
const teddy = new THREE.Group();
const bearMat = new THREE.MeshToonMaterial({ color: 0xd97706 });
const bearMuzzleMat = new THREE.MeshToonMaterial({ color: 0xfef3c7 });
const darkMat = new THREE.MeshToonMaterial({ color: 0x1e293b });
const redBowMat = new THREE.MeshToonMaterial({ color: 0xef4444 });

// Teddy Body
const tBody = new THREE.Mesh(new THREE.SphereGeometry(1.35, 18, 18), bearMat);
tBody.position.y = 1.3;
teddy.add(tBody);

// Teddy Head
const tHead = new THREE.Mesh(new THREE.SphereGeometry(1.1, 18, 18), bearMat);
tHead.position.set(0, 2.6, 0.2);
teddy.add(tHead);

// Snout
const tSnout = new THREE.Mesh(new THREE.SphereGeometry(0.44, 14, 14), bearMuzzleMat);
tSnout.position.set(0, 2.4, 1.15);
teddy.add(tSnout);

// Nose
const tNose = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), darkMat);
tNose.position.set(0, 2.55, 1.55);
teddy.add(tNose);

// Eyes
const tEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), darkMat);
tEyeL.position.set(-0.35, 2.75, 1.15);
const tEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), darkMat);
tEyeR.position.set(0.35, 2.75, 1.15);
teddy.add(tEyeL, tEyeR);

// Cheerful Big Rounded Ears
const tEarGeo = new THREE.SphereGeometry(0.4, 12, 12);
const tEarL = new THREE.Mesh(tEarGeo, bearMat);
tEarL.position.set(-0.9, 3.5, 0.2);
const tEarR = new THREE.Mesh(tEarGeo, bearMat);
tEarR.position.set(0.9, 3.5, 0.2);
teddy.add(tEarL, tEarR);

// Playful Bowtie
const bowMesh = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.11, 8, 16), redBowMat);
bowMesh.position.set(0, 1.9, 1.3);
teddy.add(bowMesh);

// Teddy Waving Arms
const armGeo = new THREE.CylinderGeometry(0.24, 0.34, 1.25, 12);
const tArmR = new THREE.Mesh(armGeo, bearMat);
tArmR.position.set(1.45, 1.85, 0.35);
tArmR.rotation.z = -1.4;
teddy.add(tArmR);

const tArmL = new THREE.Mesh(armGeo, bearMat);
tArmL.position.set(-1.45, 1.85, 0.35);
tArmL.rotation.z = 1.4;
teddy.add(tArmL);

teddy.position.set(0, -0.1, 0.2);
scene.add(teddy);

// ----------------------------------------------------
// 2. PIP THE PUPPY 🐶 (Bouncing, high hops & perky tail wag)
// ----------------------------------------------------
const puppy = new THREE.Group();
const pupMat = new THREE.MeshToonMaterial({ color: 0xfbbf24 });
const earMat = new THREE.MeshToonMaterial({ color: 0xd97706 });
const whiteMat = new THREE.MeshToonMaterial({ color: 0xffffff });

const pBody = new THREE.Mesh(new THREE.SphereGeometry(0.95, 16, 16), pupMat);
pBody.position.y = 0.95;
puppy.add(pBody);

const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), pupMat);
pHead.position.set(0, 1.8, 0.4);
puppy.add(pHead);

const pSnout = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), whiteMat);
pSnout.position.set(0, 1.65, 1.05);
puppy.add(pSnout);

const pNose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), darkMat);
pNose.position.set(0, 1.8, 1.4);
puppy.add(pNose);

// Puppy Eyes
const pEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), darkMat);
pEyeL.position.set(-0.3, 1.95, 1.15);
const pEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), darkMat);
pEyeR.position.set(0.3, 1.95, 1.15);
puppy.add(pEyeL, pEyeR);

// Floppy Ears
const pEarGeo = new THREE.CylinderGeometry(0.16, 0.34, 1.05, 10);
const pEarL = new THREE.Mesh(pEarGeo, earMat);
pEarL.position.set(-0.75, 2.0, 0.35);
pEarL.rotation.z = 0.65;
const pEarR = new THREE.Mesh(pEarGeo, earMat);
pEarR.position.set(0.75, 2.0, 0.35);
pEarR.rotation.z = -0.65;
puppy.add(pEarL, pEarR);

// Wagging Tail
const pTail = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.16, 0.8, 8), earMat);
pTail.position.set(0, 1.15, -0.95);
pTail.rotation.x = -0.95;
puppy.add(pTail);

// Cyan Bandana
const bandana = new THREE.Mesh(new THREE.TorusGeometry(0.68, 0.15, 8, 20), new THREE.MeshToonMaterial({ color: 0x06b6d4 }));
bandana.position.set(0, 1.45, 0.3);
bandana.rotation.x = Math.PI / 2.3;
puppy.add(bandana);

puppy.position.set(-4.5, 0.0, 2.4);
scene.add(puppy);

// ----------------------------------------------------
// 3. BELLA BUNNY 🐰 (Hopping towards kids with soft springy ears)
// ----------------------------------------------------
const bunny = new THREE.Group();
const pinkMat = new THREE.MeshToonMaterial({ color: 0xf472b6 });

const bBody = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16), whiteMat);
bBody.position.y = 0.9;
bunny.add(bBody);

const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.76, 16, 16), whiteMat);
bHead.position.set(0, 1.8, 0.12);
bunny.add(bHead);

// Long Ears
const bEarGeo = new THREE.CylinderGeometry(0.14, 0.22, 1.35, 10);
const bEarL = new THREE.Mesh(bEarGeo, whiteMat);
bEarL.position.set(-0.32, 2.85, 0.12);
bEarL.rotation.z = -0.15;
const bEarR = new THREE.Mesh(bEarGeo, whiteMat);
bEarR.position.set(0.32, 2.85, 0.12);
bEarR.rotation.z = 0.15;

const bInnerEarGeo = new THREE.CylinderGeometry(0.07, 0.11, 1.05, 8);
const bInL = new THREE.Mesh(bInnerEarGeo, pinkMat);
bInL.position.set(-0.32, 2.8, 0.2);
bInL.rotation.z = -0.15;
const bInR = new THREE.Mesh(bInnerEarGeo, pinkMat);
bInR.position.set(0.32, 2.8, 0.2);
bInR.rotation.z = 0.15;
bunny.add(bEarL, bEarR, bInL, bInR);

// Bunny Face
const bEyeL = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), darkMat);
bEyeL.position.set(-0.24, 1.9, 0.76);
const bEyeR = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), darkMat);
bEyeR.position.set(0.24, 1.9, 0.76);
const bNose = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), pinkMat);
bNose.position.set(0, 1.75, 0.84);
bunny.add(bEyeL, bEyeR, bNose);

bunny.position.set(4.6, 0.0, 2.6);
scene.add(bunny);

// ----------------------------------------------------
// 4. FLYING WONDER BIRDS 🐦 (Flapping happily around calling "Come play!")
// ----------------------------------------------------
const birds = [];
const birdMat = new THREE.MeshToonMaterial({ color: 0x38bdf8 });
const beakMat = new THREE.MeshToonMaterial({ color: 0xf59e0b });

for (let i = 0; i < 4; i++) {
  const bird = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), birdMat);
  body.scale.set(1, 0.75, 1.3);
  bird.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, 8, 8), birdMat);
  head.position.set(0, 0.24, 0.48);
  bird.add(head);

  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.32, 6), beakMat);
  beak.position.set(0, 0.22, 0.8);
  beak.rotation.x = Math.PI / 2;
  bird.add(beak);

  const wingGeo = new THREE.BoxGeometry(0.85, 0.06, 0.48);
  const wL = new THREE.Mesh(wingGeo, birdMat);
  wL.position.set(-0.52, 0.08, 0);
  const wR = new THREE.Mesh(wingGeo, birdMat);
  wR.position.set(0.52, 0.08, 0);
  bird.add(wL, wR);

  bird.userData = { wL, wR, angle: (i / 4) * Math.PI * 2, rad: 7.2 + i * 2.0, spd: 0.85 + i * 0.15, yBase: 4.2 + i * 1.1 };
  scene.add(bird);
  birds.push(bird);
}

// Mouse / Touch Interaction for Parallax Look
let mouseX = 0, mouseY = 0;
let tgtX = 0, tgtY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
});

// Interactive Click to make animals jump happily
window.addEventListener('pointerdown', () => {
  // Joyful burst
  jumpBoost = 1.0;
});
let jumpBoost = 0;

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  tgtX += (mouseX * 2.2 - tgtX) * 0.06;
  tgtY += (mouseY * 1.2 - tgtY) * 0.06;

  camera.position.x = tgtX * 1.3;
  camera.position.y = 4.5 + tgtY * 0.9;
  camera.lookAt(0, 1.8, 0);

  // Jump boost decays
  jumpBoost *= 0.92;

  // Teddy Bear welcoming bounce & friendly double-arm wave
  teddy.position.y = -0.1 + Math.sin(t * 3.0) * 0.14 + jumpBoost * 0.6;
  tHead.rotation.y = Math.sin(t * 1.8) * 0.3;
  tArmR.rotation.z = -1.4 + Math.sin(t * 6.5) * 0.45;
  tArmR.rotation.x = Math.cos(t * 6.5) * 0.25;
  tArmL.rotation.z = 1.4 - Math.sin(t * 6.5 + 0.5) * 0.45;
  tArmL.rotation.x = Math.cos(t * 6.5 + 0.5) * 0.25;

  // Pip the Puppy high excited hops & tail wag
  const pupHop = Math.abs(Math.sin(t * 4.4));
  puppy.position.y = 0.0 + pupHop * 0.9 + jumpBoost * 0.8;
  pTail.rotation.z = Math.sin(t * 18) * 0.8;
  pEarL.rotation.z = 0.65 + Math.sin(t * 9) * 0.25;
  pEarR.rotation.z = -0.65 - Math.sin(t * 9) * 0.25;
  puppy.rotation.y = Math.sin(t * 2.2) * 0.4;

  // Bella Bunny cheerful hopping towards screen
  const bunHop = Math.abs(Math.sin(t * 5.0));
  bunny.position.y = 0.0 + bunHop * 1.05 + jumpBoost * 0.9;
  bEarL.rotation.x = Math.sin(t * 5.5) * 0.3;
  bEarR.rotation.x = Math.sin(t * 5.5 + 0.3) * 0.3;
  bunny.rotation.y = -Math.sin(t * 2.2) * 0.4;

  // Flying Birds
  birds.forEach((b) => {
    b.userData.angle += b.userData.spd * 0.022;
    const r = b.userData.rad;
    b.position.x = Math.cos(b.userData.angle) * r;
    b.position.z = Math.sin(b.userData.angle) * (r * 0.65) - 1.5;
    b.position.y = b.userData.yBase + Math.sin(t * 2.5 + b.userData.angle) * 0.7;
    b.rotation.y = -b.userData.angle - Math.PI / 2;
    
    const flap = Math.sin(t * 20) * 0.7;
    b.userData.wL.rotation.z = flap;
    b.userData.wR.rotation.z = -flap;
  });

  // Floating Stars bobbing and twirling
  stars.forEach((s, idx) => {
    s.mesh.position.y = s.initY + Math.sin(t * s.speed + idx) * 0.45;
    s.mesh.rotation.y += 0.025;
    s.mesh.rotation.x += 0.018;
  });

  // Clouds drifting
  clouds.forEach((c, idx) => {
    c.position.x += Math.sin(t * 0.35 + idx) * 0.008;
  });

  // Little red apples bobbing gently
  appleList.forEach((ap, idx) => {
    ap.group.position.y = 0.1 + Math.sin(t * 3.0 + idx) * 0.06;
    ap.group.rotation.y += 0.015;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || (window.innerHeight * 0.75);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_45 -->
</body>
</html>
