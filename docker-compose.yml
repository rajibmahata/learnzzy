services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      APP_ENV: production
      MONGODB_URI: mongodb://mongo:27017/learnzzy
      MONGODB_DB_NAME: learnzzy
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET}
      PARENT_AUTH_SECRET: ${PARENT_AUTH_SECRET:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      # Local Docker serves plain HTTP: allow non-Secure session cookies.
      # Production (TLS) overrides this to "true" in docker-compose.prod.yml.
      COOKIE_SECURE: "false"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  # NOTE: no separate worker service. The web process registers BullMQ
  # workers in-process when REDIS_URL is set (see src/queue/queue.ts), so
  # background agent jobs run durably without a second container. Scale by
  # adding web replicas; a standalone worker requires a compiled worker
  # artifact (src/workers/worker.ts is TypeScript with path aliases).

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Host side is 27018 (not 27017): the default MongoDB port is commonly
      # taken by other local instances/containers. Container side stays 27017,
      # so in-Docker URIs are unchanged (mongodb://mongo:27017/...).
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
