<script>
  let isSoundOn = true;

  function toggleSound() {
    isSoundOn = !isSoundOn;
    const icon = document.getElementById('soundIcon');
    if (icon) {
      icon.textContent = isSoundOn ? 'volume_up' : 'volume_off';
    }
  }

  function playPromptAudio() {
    const feedback = document.getElementById('feedbackText');
    if (feedback) {
      feedback.textContent = 'Counting: 3 red apples plus 2 red apples!';
      setTimeout(() => {
        feedback.textContent = 'Tap the number that matches!';
      }, 3000);
    }
  }

  function triggerBuddyHint() {
    const feedback = document.getElementById('feedbackText');
    if (feedback) {
      feedback.textContent = 'Put them together: 3... then 4, 5! Five apples!';
      const correctBtn = document.getElementById('correctChoiceBtn');
      if (correctBtn) {
        correctBtn.classList.add('scale-105');
        setTimeout(() => correctBtn.classList.remove('scale-105'), 600);
      }
    }
  }

  function handleOption(num, btn) {
    const feedback = document.getElementById('feedbackText');
    if (num === 5) {
      if (feedback) {
        feedback.textContent = 'Hooray! 3 + 2 = 5! You earned a star!';
      }
      btn.classList.remove('bg-tertiary-fixed');
      btn.classList.add('bg-tertiary', 'text-on-tertiary');
    } else {
      if (feedback) {
        feedback.textContent = 'Almost! Count them one by one!';
      }
      btn.classList.add('translate-x-1');
      setTimeout(() => btn.classList.remove('translate-x-1'), 200);
    }
  }
